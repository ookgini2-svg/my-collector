<!DOCTYPE html><html lang="ko"><head><base target="_blank">

    <meta charset="UTF-8">
    <title>Arcana Masterpiece - Final Collector Edition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <style>
        @font-face {
            font-family: 'Galmuri14';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2506-1@1.0/Galmuri14.woff2') format('woff2');
            font-weight: normal;
        }

        :root {
            --bg-color: #f0f2f5; 
            --panel: #fff;
            --main-color: #22C55E;
            --text-color: #333;
            --glass-color: rgba(255, 255, 255, 0.4);
            --blur: 20px;
            --home-scale: 1;
        }
    
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--main-color); border-radius: 10px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        body {
            margin: 0; font-family: 'Galmuri14', sans-serif;
            background-color: var(--bg-color); background-repeat: no-repeat;
            background-size: cover; background-position: center;
            background-attachment: fixed; display: grid; 
            grid-template-columns: 380px 1fr; height: 100vh; overflow: hidden;
            color: var(--text-color);
        }

        /* 에디터 패널 디자인 */
        .editor-panel { 
            background: var(--panel); border-right: 1px solid #ddd; padding: 25px; 
            overflow-y: auto; height: 100vh; box-sizing: border-box; z-index: 100;
            box-shadow: 5px 0 15px rgba(0,0,0,0.05);
        }
        .control-group { background: #f9f9f9; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #eee; }
        .control-group label { display: block; font-size: 11px; font-weight: bold; color: #666; margin-bottom: 5px; }
        
        input, textarea, select { 
            width: 100%; box-sizing: border-box; border: 1px dashed #ccc; 
            padding: 8px; border-radius: 6px; font-family: 'Galmuri14'; margin-bottom: 8px; font-size: 11px;
        }

        .btn-row { display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap; }
        .add-btn { 
            background: var(--main-color); color: white; border: none; 
            padding: 10px; border-radius: 8px; cursor: pointer; 
            font-weight: bold; transition: 0.2s; font-family: 'Galmuri14'; font-size: 11px;
        }
        .add-btn:hover { opacity: 0.8; }

        /* 프리뷰 및 홈피 레이아웃 */
        .preview-area { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.05); overflow: auto; padding: 40px; position: relative; }
        .home-container {
            display: grid; grid-template-columns: 240px 1fr;
            width: 880px; height: 600px; gap: 20px; padding: 30px;
            background: var(--glass-color); backdrop-filter: blur(var(--blur));
            border-radius: 45px; position: relative;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            transform: scale(var(--home-scale));
        }

        .sidebar { display: flex; flex-direction: column; gap: 15px; z-index: 10; overflow: hidden; }
        .profile-card { background: rgba(255,255,255,0.4); padding: 20px; border-radius: 35px; text-align: center; border: 1px solid rgba(255,255,255,0.2); }
        .profile-img-wrap { width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--main-color); margin: 0 auto 10px; overflow: hidden; }
        
        .mini-player { 
            background: rgba(0,0,0,0.05); 
            border-radius: 18px; 
            overflow: hidden; 
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        #youtube-frame { width: 100%; height: 100%; border: none; display: block; }
        
        .sns-link { background: #333; color: white; text-decoration: none; padding: 10px; border-radius: 12px; font-size: 10px; text-align: center; font-weight: bold; margin-bottom: 4px; display: block; transition: 0.2s; }
        .sns-link:hover { background: #555; }
        
        .main-content { background: rgba(255,255,255,0.1); border-radius: 35px; padding: 25px; display: flex; flex-direction: column; overflow: hidden; z-index: 10; }
        
        .content-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            grid-auto-rows: min-content;
            gap: 15px; 
            overflow-y: auto; 
            flex: 1; 
            align-content: start; 
            padding-right: 5px;
        }
        
        .item-block { 
            aspect-ratio: 5.5 / 8.5; background: #fff; border-radius: 12px; 
            overflow: hidden; cursor: pointer; position: relative;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); transition: 0.2s;
            height: fit-content;
        }
        .item-block:hover { transform: translateY(-5px); }
        .item-block img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

        #sticker-layer { position: absolute; top:0; left:0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .sticker { position: absolute; cursor: move; pointer-events: auto; }
        .sticker img { pointer-events: none; width: 100%; height: 100%; object-fit: contain; }

        #modal-overlay { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); 
            display: none; align-items: center; justify-content: center; 
            z-index: 2000; border-radius: 45px; 
        }
        .modal-content { width: 450px; max-height: 85%; background: #fff; border-radius: 25px; overflow: hidden; }
        .modal-body { padding: 30px; overflow-y: auto; }

        .manage-box { max-height: 80px; overflow-y: auto; background: #fff; border: 1px solid #eee; margin-top: 5px; font-size: 10px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-bottom: 1px solid #eee; }
        .del-btn { background: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 9px; }

        .maker-credit {
            position: fixed; bottom: 20px; left: 20px; 
            font-size: 12px; color: rgba(0,0,0,0.4); 
            background: rgba(255,255,255,0.5); padding: 5px 10px; 
            border-radius: 20px; z-index: 9999; pointer-events: none;
        }
    </style>
    <style>
        :root {
            --main-color: #512475 !important;
            --glass-color: rgba(177,155,228,0.2) !important;
            --home-scale: 0.9 !important;
        }
        body { grid-template-columns: 1fr !important; background-image: url('') !important; background-size: cover !important; }
        .editor-panel { display: none !important; }
        .preview-area { height: 100vh; padding: 0; background: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #512475; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="preview-area">
        <div style="position:fixed!important;bottom:20px!important;left:20px!important;font-size:12px!important;color:rgba(0,0,0,0.3)!important;background:rgba(255,255,255,0.4)!important;padding:6px 12px!important;border-radius:20px!important;z-index:99999!important;pointer-events:none!important;font-family:sans-serif!important;letter-spacing:-0.5px!important;">@tpvhtlsrhr0122 미니홈피 제작기 사용</div>
        <div class="home-container" id="home-box">
            <div id="modal-overlay" onclick="closeModal()" style="display: none;">
                <div class="modal-content" onclick="event.stopPropagation()">
                    <img id="modal-img" style="width: 100%; height: 200px; object-fit: cover; display: block;" src="">
                    <div class="modal-body">
                        <div id="modal-title" style="font-weight:bold; font-size:1.2rem; margin-bottom:10px; color:var(--main-color);"></div>
                        <div id="modal-desc" style="white-space:pre-wrap; font-size:0.9rem; line-height:1.6;"></div>
                    </div>
                </div>
            </div>

            <div class="sidebar">
                <div class="profile-card">
                    <div class="profile-img-wrap"><img id="p-img" src="https://i.imgur.com/BahgKQ6.jpeg" style="width:100%; height:100%; object-fit:cover;"></div>
                    <div id="p-name" style="font-weight:bold; color:var(--main-color);">곰을치면곰치</div>
                    <div id="p-bio" style="font-size:0.8rem; margin-top:5px; color:#666; white-space:pre-wrap;">노아, 웅</div>
                </div>
                <div id="player-container" class="mini-player" style="display: none;"><iframe id="youtube-frame" src="" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe></div>
                <div id="link-area"></div>
            </div>

            <div class="main-content">
                <div style="margin-bottom:15px; font-weight:bold; color:var(--main-color);">목록</div>
                <div id="grid" class="content-grid"></div>
            </div>

            <div id="sticker-layer"><div class="sticker" style="left: -9px; top: 307px; width: 380px; height: 380px;"><img src="https://i.imgur.com/pLrt7nH.png"></div></div>
        </div>
    </div>

    <script>
        const appData = {
            "settings": {
                "bgUrl": "",
                "pImg": "https://i.imgur.com/BahgKQ6.jpeg",
                "name": "곰을치면곰치",
                "bio": "노아, 웅",
                "yt": "",
                "pointColor": "#512475",
                "glassHex": "#b19be4",
                "glassAlpha": "20",
                "scale": "0.9"
            },
            "posts": [
                {
                    "title": "ABOUT",
                    "img": "https://i.imgur.com/75B5TZ4.png",
                    "desc": "성인여성\n노아, 웅 변동닉. 편하신 걸로 불러주세요.\n명일방주 열심히 하고 있습니다.\nTRPG, 명일방주 위주로 굴러갑니다.\n언급은 적지만, 트위스티드 원더랜드 제이드 리치와 드림을 하고 있습니다.\n발언 편하게 하는 계정입니다.\n계정 이동은 1년마다 하는 편입니다.\n탐라에서 자만추 하더라도, 선팔하지 않는 이상 스루해주세요."
                },
                {
                    "title": "TRPG",
                    "img": "https://i.imgur.com/uLg1rx2.png",
                    "desc": "coc 은닉 위주\n주로 지엠을 잡습니다. 탐사자도 좋아합니다.\n캐잣말을 자주 하진 않습니다. 연공 시, 관련 기대는 접고 오시는 편이 이롭습니다.\n자관 복지 좋지 못합니다. 기본 방치에 가깝습니다. 관련해서 상호 스트레스를 안 받았으면 좋겠기에, 조율 와주시면 노력하겠습니다."
                },
                {
                    "title": "NG",
                    "img": "https://i.imgur.com/BS2trgT.png",
                    "desc": "불편한 요소는 주로 흐린 눈하고 지나갑니다.\n🐬🦈 >> 근친 요소 힘듭니다. 이 둘을 제외하고는 신경 안 씁니다.\n연락 독촉. 중요한 연락은 최대한 빠르게 확인하지만, 기본적으로 뭐든 여유롭게 하는 편입니다.\n겹nn. 제 세계선에서 제이드 리치, 노웰이 최애인 사람은 저 하나면 좋겠습니다. 겹nn 견제라고 느껴지실 경우, 팔로우 재고해주세요.\n트정에 대해 큰 의미를 두지 않습니다. 계정 성향이 조금이라도 안 맞는다 싶으면, 즉시 정리하는 편이라 다시 받지도 않습니다. 저 또한 불편하다 싶으면 바로 정리해주세요."
                }
            ],
            "links": [],
            "stickers": [
                { "url": "https://i.imgur.com/pLrt7nH.png", "x": -9, "y": 307, "size": 380 }
            ]
        };

        window.onload = () => {
            renderPosts();
            document.querySelectorAll('.sticker').forEach(s => s.style.cursor = 'default');
        };

        function renderPosts() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            appData.posts.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'item-block';
                item.innerHTML = `<img src="${p.img}">`;
                item.onclick = () => openModal(i);
                grid.appendChild(item);
            });
        }

        function openModal(i) {
            const p = appData.posts[i];
            const mImg = document.getElementById('modal-img');
            if(p.img) { mImg.src = p.img; mImg.style.display = 'block'; } else { mImg.style.display = 'none'; }
            document.getElementById('modal-title').textContent = p.title || '무제';
            const mDesc = document.getElementById('modal-desc');
            mDesc.innerText = p.desc || '';
            document.getElementById('modal-overlay').style.display = 'flex';
            if (window.renderMathInElement) {
                renderMathInElement(mDesc, { delimiters: [{left: '$', right: '$', display: false}] });
            }
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    </script>
</body>
</html>
